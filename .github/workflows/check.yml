name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- cutout-tool.html skills/gpt-image-2-subject-assets/assets/cutout-tool.html
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:walkthrough
      - run: npm run check
      - run: python -m pip install -r requirements.txt
      - run: python scripts/verify_examples.py
